<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestão de Contatos</title>
  <link rel="stylesheet" href="style.css">
  <script src="main.js" defer></script>
</head>
<body>
  <main>
    <header>
      <h1>Gestão de Contatos</h1>
      <button type="button" id="addButton" class="primary">Adicionar Contato</button>
    </header>
    <section id="formSection">
      <h2>Adicionar Contato</h2>
      <form>
        <input type="text" placeholder="Nome" name="name" required />
        <input type="email" placeholder="Email" name="email" required />
        <input type="tel" placeholder="Telefone" name="phone" required />
        <div class="buttons">
          <button type="button" id="cancelButton">Cancelar</button>
          <button type="submit" class="primary">Adicionar</button>
        </div>
      </form>
    </section>
    <section>
      <h2>Lista de Contatos</h2>
      <table>
        <thead>
          <tr>
            <th>Nome</th>
            <th>Email</th>
            <th>Telefone</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody>
        </tbody>
      </table>
    </section>
  </main>
</body>
</html>
