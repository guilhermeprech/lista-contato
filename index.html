
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestão de Contatos</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/main.js" defer></script>
</head>
<body>
  <main>
    <header>
      <h1>Gestão de Contatos</h1>
      <button type="button" id="addButton" class="primary">
        Adicionar Contato
      </button>
    </header>

    <section id="formSection">
      <h2>Adicionar Contato</h2>

      <form>
        <input type="text" name="name" placeholder="Nome" required>
        <input type="email" name="email" placeholder="Email" required>
        <input type="tel" name="phone" placeholder="Telefone" required>

        <div class="buttons">
          <button type="button" id="favoriteButton" class="favorite">Favoritar</button>
          <button type="button" id="cancelButton">Cancelar</button>
          <button type="submit" class="primary">Adicionar</button>
        </div>
      </form>
    </section>

    <section>
      <h2>Lista de Contatos</h2>

      <div class="filters">
        <input
          type="text"
          id="searchInput"
          placeholder="Buscar contato..."
          aria-label="Buscar contato"
        >

        <select id="filterSelect" aria-label="Filtrar contatos">
          <option value="all">Todos os contatos</option>
          <option value="favorites">Somente favoritos</option>
        </select>
      </div>

      <table id="contactsTable">
        <thead>
          <tr>
            <th>Nome</th>
            <th>Email</th>
            <th>Telefone</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>

      <p id="emptyMessage" style="display: none;" role="status">
        Nenhum contato encontrado.
      </p>
    </section>
  </main>
</body>
</html>
